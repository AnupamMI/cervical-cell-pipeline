# nc_mask_pipeline configuration. Every path and tunable number lives here.
# Relative paths are resolved against the folder holding THIS file.

input:
  extensions: [.jpg, .jpeg, .png, .tif, .tiff, .bmp]
  recursive: false            # true = also scan sub-folders (the output folder may then not be inside the input)
  sixteen_bit: cv2            # 16-bit -> 8-bit. cv2 = exactly cv2.imread(path), the training reader (OpenCV uses
                              # round(x/257) for TIFF but x>>8 for PNG); scale = round(x/257) for every format;
                              # max = scale by the image's own max (for 10/12-bit data stored in 16-bit files)

device: auto                  # auto (cuda if available) | cuda | cpu
seed: 0

detector:
  weights: models/detector/cell_yolo26s_v2_best.pt
  imgsz: 640                  # training imgsz of this checkpoint (train_args.imgsz); 0 = read it from the checkpoint
  conf: 0.15                  # was 0.25. On cervical_0001 two visibly missed cells are found at 0.15 (conf 0.240, 0.163)
                              # and boxes rise 35 -> 38 (+8.6%); see reports/conf_sweep_cervical_0001.json
  nms_iou: 0.7                # class-agnostic NMS after detection (and after merging tiles). 0.7 = train_args.iou
  max_det: 300                # per image / per tile (train_args.max_det)
  min_box_px: 16              # boxes with width or height below this are not segmented (flag box_too_small)
  containment_thr: 0.8        # before seg: drop a box if >= this share of its area lies inside a higher-conf box
                              # (null or 0 = off). Dropped boxes are logged and listed in dropped.csv
  containment_min_area_ratio: 0.4   # only drop if the box is also >= this share of the containing box's area (keeps
                                    # small cells lying on big ones; as run_nc). 0 = drop on containment alone
  tiling:
    # Measured on 40 MAX06 FOVs (2028x1520, 483 GT boxes, reports/detector_tiling.json): recall full-frame 0.981,
    # tiled 1280/640 0.967, tiled 1024/512 0.843 (loses large cells). Full-frame is the default for 2028-px FOVs.
    mode: off                 # off | on | auto (auto = tile when max(H, W) > trigger_factor * imgsz)
    trigger_factor: 4.0       # with imgsz 640: auto tiles only FOVs larger than 2560 px
    tile_px: 1280             # tile size in FOV pixels (each tile is then run at imgsz)
    overlap_px: 640           # must exceed the largest cell; boxes touching an inner tile edge are dropped
    edge_px: 2                # "touching an inner tile edge" tolerance

consensus:
  detection_mode: consensus_flag   # single = detector A only (B never loaded)
                                   # consensus_flag = A and B both run; every A box is segmented and tagged
                                   #   det_tag consensus (A box matched to a B box) or s_only (A only)
                                   # consensus_filter = as consensus_flag, but s_only boxes are not segmented
                                   #   (listed in dropped.csv, reason s_only_filtered)
                                   # In both consensus modes B boxes without an A partner go to l_only.csv (never segmented)
  match_iou: 0.5                   # A<->B one-to-one matching (Hungarian on IoU), match if IoU >= this.
                                   # Matched cells keep A's box (crop margin / seg parity unchanged)

detector_b:                        # cross-check detector, used only in the consensus modes
  weights: models/detector_b/yolo26l_1280_best.pt   # YOLO26l trained at 1280 (release copy, sha256 703f3e71...)
  imgsz: 1280
  conf: 0.15
  nms_iou: 0.7
  max_det: 300

detector_c:                        # "detector C": cluster / debris detector, INFORMATION ONLY (not validated enough to gate)
  enabled: true                    # false = never loaded. A missing .pt switches it off (logged), like detector_b
  weights: models/detector_c/yolo26s_1024_ccd_best.pt   # YOLO26s @1024, classes [cell, cluster, debris] (sha256 a72ae657...)
  imgsz: 1024
  conf: 0.5                        # test mAP50 cluster 0.503 / debris 0.539; many background false positives at 0.25
  nms_iou: 0.7                     # per-class NMS (as Ultralytics predict / val for this checkpoint)
  max_det: 300
  classes: [cluster, debris]       # ONLY these classes are used; its `cell` class is ignored (YOLO26s stays the
                                   # only source of cells)
  near_frac: 0.5                   # near_cluster / near_debris when >= this share of a cell's detector box lies inside a
                                   # C box of that class (info tag; with voting on, such a cell is not segmented)
  cell_conf: 0.25                  # C's own `cell` class: used ONLY as a vote (voting below), never as a cell source

voting:                            # which boxes get segmented. Off = every YOLO26s box (pipeline v3 behaviour, the
                                   # samples/expected references). The web app turns it on by default (vote=true)
  enabled: false
  mode: cascade                    # cascade: YOLO26s proposes -> detector C must confirm -> YOLO26l must
                                   # confirm -> segmented (a check that did not run is skipped).
                                   # majority: >= min_votes of A / B / C agree; B+C-only cells added (bc_only)
  min_votes: 2                     # votes = detectors with a box at IoU >= match_iou: A (YOLO26s), B (YOLO26l),
                                   # C (detector C cell class). 2 = majority of 3. If fewer detectors ran (consensus or
                                   # detector C off), the requirement is min(min_votes, detectors that ran)
  match_iou: 0.5
  skip_in_cluster_debris: true     # a voted cell with >= detector_c.near_frac of its box inside a cluster / debris
                                   # box is not segmented either (reason inside_cluster / inside_debris)
  # Not segmented boxes stay in the outputs with status not_segmented and reason not_voted / inside_*.
  # B+C boxes without an A partner can win the vote too (det_tag bc_only, B's box and confidence).

crop:
  margin: 0.17              # per side, fraction of max(box w, h). = aug_v2.PAD used to build the v2/v2_1 training and
                              # eval crops. Measured on the 9,147 raw tinyseg crops: median 0.177 (IQR 0.150-0.197),
                              # see reports/crop_margin.json
  edge_mode: reflect          # reflect = mirror-pad outside the FOV exactly like the training/eval crops
                              # (aug_v2.pipeline_crop; requires margin == aug_v2.PAD) | clamp = cut the crop at the FOV edge.
                              # Either way, a crop window that extends past the FOV gets the info flag crop_clamped

seg:
  code_dir: vendor/tinyseg_retrain   # verbatim copies of tinyseg.py, aug_v2.py, data.py from tinyseg_retrain
  weights: models/seg/v2_1/best.pt   # default v2_1 (models/seg/v2_1/best.pt, variant auto). Option: models/seg/V1_v3/best.pt with variant V1 (TinyUNet v3 Macenko; slower, see README); v2: models/seg/v2/best.pt (4-channel)
  model_config: null                 # null = config.json next to the weights ({"in_ch":..,"size":..,"variant":..});
                                     # no config.json = 3-channel 160 px (v1), as in evaluate_v2.load_model
  variant: auto                      # with V1_v3 use V1 (or auto). auto = the model's config.json; otherwise V0|V1|V2|V3|box and it MUST match it
  preprocess_code: vendor/tinyseg_v3/preprocess.py   # training preprocessing (Macenko, LAB-CLAHE, H channel), verbatim
  preprocessing_dir: null            # null = folder of the weights; must hold stain_ref.json (V1/V2) / h_stats.json (V3)
  batch_size: 64
  thr_nucleus: 0.5
  thr_cell: 0.5

postprocess:
  clip_tolerance_px: margin   # cell mask is clipped to the detector box + this per side. margin = crop.margin * max(box w, h),
                              # i.e. the crop window itself: no clipping inside the crop (neighbours are handled by the
                              # centre-component choice + overlap resolution). A number = that many px (earlier default 16).
                              # Any pixels a clip removes -> flag box_clipped and column clipped_frac
  nucleus_min_component_px: 20  # nucleus blobs smaller than this don't count towards multi_nucleus
  cell_at_edge_px: 2          # detector box within this many px of the FOV border -> flag cell_at_edge (real truncation)
  drop_lost_frac: null        # v3: no cell is dropped for overlap. Measurement uses each cell's FULL mask (overlaps
                              # allowed); the exclusive label map (higher confidence wins) is for display -> occluded_frac

qc:                           # Stage 0, per FOV: flags only, the FOV is never skipped. Thresholds from 150 MAX06 FOVs
  blur_lapvar_min: 8.0        # variance of the Laplacian (grey, half resolution); MAX06 min 9.7, median 18.7
  mean_grey_min: 175          # MAX06 mean grey 194-217
  mean_grey_max: 235
  dark_frac_max: 0.05         # share of pixels with grey <= 20 (MAX06 max 0.001)
  stained_frac_min: 0.003     # share of pixels with optical density > 0.15 in all channels (MAX06 0.0067-0.038)
  stained_frac_max: 0.20

size:                         # from the TinyUNet training split (7,311 cells with a cell outline), pixels at 0.155 um/px
  box_area_min: 5640          # Stage 2 info flag box_size_out_of_range: detector box area outside [min, max]
  box_area_max: 532895        # (0.5 x p0.1 cell area, 2.5 x p99.9 cell area)
  cell_area_review_min: 14540 # p0.5  -> review: likely_inflammatory (too small for a squamous cell)
  cell_area_review_max: 170120 # p99.5 -> review: likely_cluster (larger than nearly every training cell)
  cell_area_implausible_min: 5640   # 0.5 x p0.1 -> excluded: implausible_mask
  cell_area_implausible_max: 319737 # 1.5 x p99.9
  nucleus_area_implausible_max: 11876 # 2 x p99.9 nucleus area

gate:                         # Stage 5: measurable / review / excluded (+ reason codes)
  occluded_review: 0.3        # occluded_frac above this -> review
  s_only_review_conf: 0.25    # s_only (YOLO26l did not confirm) with conf below this -> review
  nc_implausible_max: 1.0     # N:C (nucleus / cytoplasm) above this -> excluded: implausible_mask

output:
  overlay: true
  overlay_max_side: 0         # 0 = full resolution; otherwise downscale the overlay PNG so its longer side is this
  coco_polygon_epsilon_px: 0.0  # cv2.approxPolyDP epsilon for COCO polygons (0 = exact outline)

logging:
  level: INFO
